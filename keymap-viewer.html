<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ZMK Planck Keymap Viewer (4×12 Layers)</title>
  <style>
    :root {
      --bg: #f7f7fb;
      --card: #ffffff;
      --ink: #111;
      --muted: #666;
      --grid: #e6e6ef;
      --accent: #3a6df0;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    header {
      padding: 20px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    h1 {
      font-size: 18px;
      margin: 0 12px 0 0;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button,
    label[for=file] {
      background: var(--card);
      border: 1px solid var(--grid);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover,
    label[for=file]:hover {
      border-color: var(--accent);
    }

    input[type=file] {
      display: none;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--grid);
      background: #fff;
      resize: vertical;
      font-size: 12px;
      line-height: 1.35;
    }

    .container {
      padding: 0 20px 40px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .tip {
      color: var(--muted);
      font-size: 12px;
      margin: 6px 0 14px;
    }

    .layers {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .layer {
      background: var(--card);
      border: 1px solid var(--grid);
      border-radius: 12px;
      padding: 12px;
    }

    .layer h2 {
      font-size: 14px;
      margin: 0 0 10px;
      color: #222;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 6px;
    }

    .key {
      border: 1px solid var(--grid);
      border-radius: 10px;
      padding: 8px 6px;
      text-align: center;
      background: #fff;
      font-size: 12px;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .key small {
      display: block;
      color: var(--muted);
      font-size: 10px;
      margin-top: 2px;
    }

    .dropzone {
      border: 1.5px dashed var(--grid);
      border-radius: 12px;
      padding: 10px;
      background: #fff;
    }

    .dropzone.drag {
      border-color: var(--accent);
      background: #eef3ff;
    }

    .rowhint {
      color: var(--muted);
      font-size: 11px;
      margin-top: 6px;
    }

    .footer {
      color: var(--muted);
      font-size: 11px;
      margin-top: 10px;
    }

    .warn {
      color: #b04;
      font-weight: 600;
    }

    .ok {
      color: #0a6;
      font-weight: 600;
    }

    .hidden {
      display: none;
    }

    .small {
      font-size: 12px;
      padding: 6px 8px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Planck 4×12 ZMK Keymap Viewer</h1>
    <div class="actions">
      <label for="file">Open .keymap/.dtsi</label>
      <input id="file" type="file" accept=".keymap,.dtsi,.keymap.dtsi,.conf,.txt" />
      <button id="load-workspace" title="Try to load config/lpgalaxy_blank_slate.keymap from this repo">Load repo
        file</button>
      <button id="parse">Render from textarea</button>
      <button id="load-sample">Load sample</button>
    </div>
  </header>

  <div class="container">
    <div id="drop" class="dropzone">
      <textarea id="src"
        placeholder="Paste your ZMK keymap (.dtsi) here, then click “Render from textarea”."></textarea>
      <div class="tip">Tip: You can also drag-and-drop a .keymap.dtsi file onto this box.</div>
    </div>

    <div id="status" class="tip"></div>

    <div id="output" class="layers"></div>

    <div class="footer">Works offline. No dependencies. If your bindings are unusual, labels fall back to the raw token.
    </div>
  </div>

  <script>
    /* ---------- Utilities ---------- */
    const $ = sel => document.querySelector(sel);
    const $$ = sel => Array.from(document.querySelectorAll(sel));
    const status = msg => { $('#status').innerHTML = msg; };

    const WORKSPACE_RELATIVE = 'config/lpgalaxy_blank_slate.keymap';
    const WORKSPACE_ALTERNATIVES = [
      './' + WORKSPACE_RELATIVE,
      WORKSPACE_RELATIVE,
      '/' + WORKSPACE_RELATIVE,
      'lpgalaxy_blank_slate.keymap'
    ];

    const MOD_ICONS = { LG: "⌘", LA: "⌥", LC: "⌃", LS: "⇧" };
    const ARROWS = { LEFT: "←", RIGHT: "→", UP: "↑", DOWN: "↓" };
    const SIMPLE_KEYS = {
      BKSP: "BKSP", BSPC: "BKSP", ESC: "ESC", RET: "RET", ENTER: "ENT", TAB: "TAB", CAPS: "CAPS",
      SPACE: "SPACE", SPC: "SPACE", DEL: "DEL", HOME: "HOME", END: "END", PRT: "PRT",
      PRINTSCREEN: "PRT", "C_BRI_UP": "BRI↑", "C_BRI_DN": "BRI↓", "C_VOL_UP": "VOL↑", "C_VOL_DN": "VOL↓",
      "C_MUTE": "MUTE", "C_PLAY_PAUSE": "PLAY", "C_NEXT": "NEXT", "C_PREV": "PREV",
      "PG_UP": "PGUP", "PG_DN": "PGDN", "KP_ENTER": "ENT", "KP_N0": "0", "KP_DOT": ".",
      "KP_MINUS": "-", "KP_PLUS": "+", "KP_MULTIPLY": "*", "KP_SLASH": "/"
    };

    // produce compact modifier glyphs like LG(LEFT) -> ⌘←, LA(BKSP) -> ⌥BKSP
    function compactModifierCall(str) {
      const m = str.match(/^([A-Z]{2})\(([^)]+)\)$/);
      if (!m) return null;
      const mod = MOD_ICONS[m[1]] || m[1];
      const inner = prettyKey(m[2]);
      return mod + inner;
    }

    function prettyKey(k) {
      if (!k) return k;
      if (ARROWS[k]) return ARROWS[k];
      if (SIMPLE_KEYS[k]) return SIMPLE_KEYS[k];
      const withMod = compactModifierCall(k);
      if (withMod) return withMod;
      if (/^F\d{1,2}$/.test(k)) return k;
      const sym = {
        TILDE: "~", EXCL: "!", AT: "@", HASH: "#", DLLR: "$", PRCNT: "%", CARET: "^",
        AMPS: "&", STAR: "*", LPAR: "(", RPAR: ")", LBKT: "[", RBKT: "]",
        LBRC: "{", RBRC: "}", LT: "<", GT: ">", BSLH: "\\", FSLH: "/", DQT: '"', QUOT: "'", SEMI: ";"
      };
      if (sym[k]) return sym[k];
      return k;
    }

    /* ---------- Tokenizer/grouping per binding ---------- */
    function tokenizeBindings(text) {
      let t = text
        .replace(/\/\*[\s\S]*?\*\//g, ' ')
        .replace(/\/\/.*$/gm, ' ')
        .replace(/\s+/g, ' ')
        .trim();
      const raw = t.split(' ').filter(Boolean);
      let i = 0, ops = [];
      function next() { return raw[i++]; }
      function peek() { return raw[i]; }
      while (i < raw.length) {
        const tok = next();
        if (!tok) break;
        if (!tok.startsWith('&')) { continue; }
        switch (tok) {
          case '&kp': {
            const k = next();
            ops.push({ op: 'kp', args: [k] });
            break;
          }
          case '&mt': {
            const mod = next(), key = next();
            ops.push({ op: 'mt', args: [mod, key] });
            break;
          }
          case '&lt': {
            const layer = next(), key = next();
            ops.push({ op: 'lt', args: [layer, key] });
            break;
          }
          case '&mo': {
            const layer = next();
            ops.push({ op: 'mo', args: [layer] });
            break;
          }
          case '&to': {
            const layer = next();
            ops.push({ op: 'to', args: [layer] });
            break;
          }
          case '&bt': {
            const sub = next();
            if (sub === 'BT_SEL') {
              const slot = next();
              ops.push({ op: 'bt_sel', args: [slot] });
            } else if (sub === 'BT_CLR_ALL') {
              ops.push({ op: 'bt_clr_all', args: [] });
            } else if (sub === 'BT_CLR') {
              ops.push({ op: 'bt_clr', args: [] });
            } else {
              ops.push({ op: 'bt_raw', args: [sub] });
            }
            break;
          }
          case '&mkp': {
            const a = next();
            ops.push({ op: 'mkp', args: [a] });
            break;
          }
          case '&mmv': {
            const a = next();
            ops.push({ op: 'mmv', args: [a] });
            break;
          }
          case '&msc': {
            const a = next();
            ops.push({ op: 'msc', args: [a] });
            break;
          }
          case '&trans': { ops.push({ op: 'trans', args: [] }); break; }
          case '&sys_reset': { ops.push({ op: 'sys_reset', args: [] }); break; }
          case '&bootloader': { ops.push({ op: 'bootloader', args: [] }); break; }
          default: {
            const args = [];
            while (peek() && !peek().startsWith('&') && args.length < 3) args.push(next());
            ops.push({ op: tok.replace(/^&/, 'unknown_'), args });
          }
        }
      }
      return ops;
    }

    /* ---------- Pretty label for a single op ---------- */
    function labelOp(op) {
      const join = (arr, sep = '•') => arr.filter(Boolean).join(sep);
      switch (op.op) {
        case 'kp': return prettyKey(op.args[0]);
        case 'mt': return join([op.args[0], prettyKey(op.args[1])]);
        case 'lt': return `LT${op.args[0]}•${prettyKey(op.args[1])}`;
        case 'mo': return `MO${op.args[0]}`;
        case 'to': return `TO${op.args[0]}`;
        case 'bt_sel': return `BT${op.args[0]}`;
        case 'bt_clr': return `BTCLR`;
        case 'bt_clr_all': return `BTCLRALL`;
        case 'mkp': {
          const a = op.args[0];
          const map = { LCLK: 'LCLK', RCLK: 'RCLK', MCLK: 'MCLK' };
          return map[a] || a;
        }
        case 'mmv': {
          const a = op.args[0];
          const map = { MOVE_UP: '↑', MOVE_DOWN: '↓', MOVE_LEFT: '←', MOVE_RIGHT: '→' };
          return map[a] || a;
        }
        case 'msc': {
          const a = op.args[0];
          const map = { SCRL_UP: 'SCR↑', SCRL_DOWN: 'SCR↓', SCRL_LEFT: 'SCR←', SCRL_RIGHT: 'SCR→' };
          return map[a] || a;
        }
        case 'trans': return '⎚';
        case 'sys_reset': return 'RST';
        case 'bootloader': return '🥾LOAD';
        default: {
          const raw = [op.op.replace(/^unknown_/, '&'), ...op.args].join(' ');
          return raw;
        }
      }
    }

    /* ---------- Parse layers from .dtsi ---------- */
    function parseLayers(dtsiText) {
      const layers = [];
      const re = /([\w]+)\s*\{\s*bindings\s*=\s*<([\s\S]*?)>;/g;
      let m;
      while ((m = re.exec(dtsiText)) !== null) {
        const layerName = m[1];
        const body = m[2];
        const ops = tokenizeBindings(body);
        const rows = [];
        for (let i = 0; i < ops.length; i += 12) {
          rows.push(ops.slice(i, i + 12));
        }
        layers.push({ name: layerName, rows });
      }
      return layers;
    }

    /* ---------- Render ---------- */
    function render(layers) {
      const out = $('#output');
      out.innerHTML = '';
      if (!layers.length) {
        status('<span class="warn">No layers found. Make sure your file has “bindings = < ... >;” blocks.</span>');
        return;
      }
      const friendly = n => ({
        default_layer: 'Layer 0 — Base',
        layer_1: 'Layer 1 — Numbers / Nav',
        layer_2: 'Layer 2 — Symbols / Media',
        layer_3: 'Layer 3 — Window / BT',
        layer_4: 'Layer 4 — Mouse',
        layer_5: 'Layer 5 — Mirror / Alt Base'
      }[n] || n);

      layers.forEach(L => {
        const card = document.createElement('div');
        card.className = 'layer';

        const h = document.createElement('h2');
        h.textContent = friendly(L.name);
        card.appendChild(h);

        const grid = document.createElement('div');
        grid.className = 'grid';

        const visibleRows = L.rows.slice(0, 4);
        visibleRows.forEach((row, rIdx) => {
          const padded = row.slice(0, 12);
          while (padded.length < 12) padded.push({ op: 'trans', args: [] });
          padded.forEach(cell => {
            const div = document.createElement('div');
            div.className = 'key';
            const label = labelOp(cell);
            div.textContent = label;
            div.title = JSON.stringify(cell);
            grid.appendChild(div);
          });
        });
        card.appendChild(grid);

        if (L.rows.length > 4) {
          const hint = document.createElement('div');
          hint.className = 'rowhint';
          hint.textContent = `Note: ${L.rows.length} rows parsed; only first 4 shown for 4×12.`;
          card.appendChild(hint);
        }

        out.appendChild(card);
      });

      status(`<span class="ok">Rendered ${layers.length} layer(s).</span>`);
    }

    /* ---------- File + paste handlers ---------- */
    $('#file').addEventListener('change', async (e) => {
      const f = e.target.files?.[0];
      if (!f) return;
      const txt = await f.text();
      $('#src').value = txt;
      const layers = parseLayers(txt);
      render(layers);
    });

    $('#parse').addEventListener('click', () => {
      const txt = $('#src').value;
      const layers = parseLayers(txt);
      render(layers);
    });

    const drop = $('#drop');
    drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('drag'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
    drop.addEventListener('drop', async (e) => {
      e.preventDefault(); drop.classList.remove('drag');
      const f = e.dataTransfer.files?.[0];
      if (!f) return;
      const txt = await f.text();
      $('#src').value = txt;
      const layers = parseLayers(txt);
      render(layers);
    });

    /* ---------- Workspace file loader (tries to fetch the keymap in the repo) ---------- */
    async function tryLoadWorkspaceFile() {
      status('Trying to fetch workspace file...');
      for (const p of WORKSPACE_ALTERNATIVES) {
        try {
          const res = await fetch(p, { cache: 'no-store' });
          if (!res.ok) {
            // skip and try next
            continue;
          }
          const txt = await res.text();
          $('#src').value = txt;
          const layers = parseLayers(txt);
          render(layers);
          status(`<span class="ok">Loaded ${p}</span>`);
          return true;
        } catch (err) {
          // fetch can throw on file:// or CORS; try next
          continue;
        }
      }
      // if we reach here, none succeeded
      status(`<span class="warn">Could not load workspace file directly. If you opened this page using file://, most browsers block fetching other local files. To enable automatic load, serve the repo root using a local HTTP server and open this page via http://localhost:8000/keymap-viewer.html</span>`);
      showServeHint();
      return false;
    }

    function showServeHint() {
      // append a small UI fragment to help run a quick local server
      let el = document.getElementById('serve-hint');
      if (el) return;
      el = document.createElement('div');
      el.id = 'serve-hint';
      el.style.marginTop = '8px';
      el.innerHTML = `
    <div class="tip">Quick fix: serve this repo root with a tiny HTTP server, then click "Load repo file" again.</div>
    <div style="display:flex;gap:8px;align-items:center;margin-top:6px;">
      <pre style="margin:0;padding:6px 8px;border:1px solid var(--grid);background:#fff;border-radius:8px;">python3 -m http.server 8000</pre>
      <button id="copy-serve" class="small">Copy command</button>
    </div>
    <div class="tip">Then open <strong>http://localhost:8000/keymap-viewer.html</strong> in your browser.</div>
  `;
      $('#drop').appendChild(el);
      $('#copy-serve').addEventListener('click', async () => {
        try { await navigator.clipboard.writeText('python3 -m http.server 8000'); status('<span class="ok">Copied server command to clipboard</span>'); }
        catch (e) { status('<span class="warn">Clipboard not available — copy the command manually.</span>'); }
      });
    }

    $('#load-workspace').addEventListener('click', async () => {
      await tryLoadWorkspaceFile();
    });

    /* ---------- Sample loader (your provided keymap) ---------- */
    const SAMPLE = `#include <behaviors.dtsi>
#include <dt-bindings/zmk/keys.h>
#include <dt-bindings/zmk/modifiers.h>
#define ZMK_POINTING_DEFAULT_MOVE_VAL 1400
#define ZMK_POINTING_DEFAULT_SCRL_VAL 35
#include <dt-bindings/zmk/pointing.h>
#include <dt-bindings/zmk/bt.h>
#define SNAP_LEFT      LG(LA(LEFT))
#define SNAP_RIGHT     LG(LA(RIGHT))
#define SNAP_UP        LG(LA(UP))
#define SNAP_DOWN      LG(LA(DOWN))
#define DESK_LEFT      LC(LEFT)
#define DESK_RIGHT     LC(RIGHT)
#define SLEEP_LOCK     LG(LC(Q))
&mmv { time-to-max-speed-ms = <250>; acceleration-exponent = <1>; };
&msc { time-to-max-speed-ms = <200>; acceleration-exponent = <1>; };
/ {
 keymap {
  compatible = "zmk,keymap";
  default_layer {
    bindings = <
      &kp ESC         &kp Q         &kp W          &kp E          &kp R           &kp T        &kp Y           &kp U        &kp I             &kp O           &kp P           &kp BKSP
      &mt LCTRL TAB   &kp A         &kp S          &kp D          &kp F           &kp G        &kp H           &kp J        &kp K             &kp L           &kp SEMI        &kp QUOT
      &kp LSHFT       &kp Z         &kp X          &kp C          &kp V           &kp B        &kp N           &kp M        &kp COMMA         &kp DOT         &kp UP          &mt LSHFT RET
      &mo 1           &kp LCTRL     &kp LALT       &kp LGUI       &mo 2           &lt 5 RET    &lt 4 SPACE     &mo 3        &kp FSLH          &kp LEFT        &kp DOWN        &mt RGUI RIGHT
    >;
  };
  layer_1 {
    bindings = <
      &kp ESC         &kp LA(LEFT)  &kp LA(LEFT)   &kp UP         &kp LA(RIGHT)   &kp DLLR     &kp EQUAL       &kp N7        &kp N8           &kp N9          &kp CARET       &kp LG(BKSP)
      &kp TAB         &kp LG(F)     &kp LEFT       &kp DOWN       &kp RIGHT       &kp PRCNT    &kp CARET       &kp N4        &kp N5           &kp N6          &kp KP_MINUS    &kp KP_PLUS
      &kp LSHFT       &kp LG(Z)     &kp LG(X)      &kp LG(C)      &kp LG(V)       &trans       &kp PRINTSCREEN &kp N1        &kp N2           &kp N3          &kp KP_SLASH    &kp KP_MULTIPLY
      &trans          &kp LCTRL     &kp LALT       &kp LGUI       &kp LA(LSFT)    &kp LSFT     &kp RCTRL       &kp KP_ENTER  &kp KP_N0        &kp KP_DOT      &kp KP_MULTIPLY &kp RGUI
    >;
  };
  layer_2 {
    bindings = <
      &kp TILDE       &kp EXCL      &kp AT         &kp HASH       &kp DLLR        &kp PRCNT    &kp CARET       &kp AMPS      &kp STAR         &kp LPAR        &kp RPAR        &kp LA(BKSP)
      &kp CAPS        &kp F1        &kp F2         &kp F3         &kp F4          &kp F5       &kp F6          &kp UNDER     &kp EQUAL        &kp LT          &kp GT          &kp LPAR
      &kp LSHFT       &kp F7        &kp F8         &kp F9         &kp F10         &kp F11      &kp F12         &kp C_MUTE    &kp C_PLAY_PAUSE &kp C_NEXT      &kp PG_UP       &mt LSHFT C_VOL_UP
      &to 0           &kp LCTRL     &kp LALT       &kp LGUI       &trans          &kp RET      &kp SPACE       &mo 3         &kp PRINTSCREEN  &kp C_PREV      &kp PG_DN       &mt LCTRL C_VOL_DN
    >;
  };
  layer_3 {
    bindings = <
      &kp TILDE       &kp DESK_LEFT &kp LS(TAB)    &kp LC(UP)     &kp TAB         &kp DESK_RIGHT &kp LG(E)     &kp SNAP_LEFT &kp SNAP_UP      &kp SNAP_RIGHT  &kp SNAP_DOWN   &kp DEL
      &kp CAPS        &kp QUOT      &kp LBKT       &kp LBRC       &kp LPAR        &kp BSLH       &kp FSLH      &kp RPAR      &kp RBRC         &kp RBKT        &kp DQT         &kp QUOT
      &trans          &trans        &trans         &kp SLEEP_LOCK &trans          &trans         &bt BT_SEL 0  &kp LG(SPACE) &kp LT           &kp GT          &kp COLON       &kp LSHFT
      &to 0           &kp LCTRL     &kp LALT       &kp LGUI       &kp LALT        &kp LCTRL      &kp HOME      &bt BT_SEL 0  &bt BT_SEL 1     &bt BT_SEL 2    &bt BT_SEL 3    &bt BT_SEL 4
    >;
  };
  layer_4 {
    bindings = <
      &bt BT_CLR_ALL &kp C_BRI_UP   &kp LS(TAB)    &msc SCRL_UP   &kp TAB         &trans     &trans            &mkp LCLK      &mmv MOVE_UP    &mkp RCLK       &trans          &trans
      &bt BT_CLR     &kp C_BRI_DN   &msc SCRL_LEFT &msc SCRL_DOWN &msc SCRL_RIGHT &trans     &trans            &mmv MOVE_LEFT &mmv MOVE_DOWN  &mmv MOVE_RIGHT &trans          &trans
      &sys_reset     &trans         &trans         &trans         &trans          &trans     &trans            &to 0          &to 1           &to 2           &to 3           &to 4
      &to 0          &trans         &trans         &bootloader    &kp LALT        &kp LCTRL  &trans            &trans         &trans          &kp LEFT        &kp DOWN        &kp RGUI
    >;
  };
  layer_5 {
    bindings = <
      &kp BKSP       &kp P          &kp O          &kp I          &kp U           &kp Y        &kp T           &kp R          &kp E           &kp W           &kp Q           &kp BKSP
      &kp TAB        &kp SEMI       &kp L          &kp K          &kp J           &kp H        &kp G           &kp F          &kp D           &kp S           &kp A           &kp QUOT
      &kp LSHFT      &kp RET        &kp DOT        &kp COMMA      &kp M           &kp N        &kp B           &kp V          &kp C           &kp X           &kp Z           &mt LSHFT RET
      &to 0          &kp LCTRL      &kp LALT       &kp LGUI       &mo 2           &trans       &trans          &mo 3          &kp FSLH        &kp LEFT        &kp DOWN        &kp LC(RIGHT)
    >;
  };
 };
};`;

    $('#load-sample').addEventListener('click', () => {
      $('#src').value = SAMPLE;
      const layers = parseLayers(SAMPLE);
      render(layers);
    });

    window.addEventListener('DOMContentLoaded', () => {
      $('#src').value = SAMPLE;
      const layers = parseLayers(SAMPLE);
      render(layers);
    });
  </script>
</body>

</html>
