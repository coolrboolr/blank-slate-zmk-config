# ======================================================
# Power management
# ======================================================
CONFIG_ZMK_PM_SOFT_OFF=y
CONFIG_ZMK_IDLE_TIMEOUT=600000
# 10 min idle before sleep
CONFIG_ZMK_SLEEP=n
# no automatic deep sleep

# Overrides the board's 1 ms press / 5 ms release debounce for every key.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=8

# ======================================================
# Mouse support and tuning
# ======================================================
CONFIG_ZMK_MOUSE=y

# ======================================================
# Behavior tuning
# ======================================================
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=32

